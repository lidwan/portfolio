<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>404 Not Found</title>
        <style>
            :root {
                --color-links:rgb(114, 160, 197);
                --color-links-darker:rgb(58, 80, 97);
            }
            html {
                height: 90%;
                display: flex;
                justify-content: center;
                /*align-content: center;*/
            }
            body {
                font-family: sans-serif;
                text-align: center;
                background-color: black;
                color: white;
                align-self: center;
                padding: 3vh;
            }
            a {
                text-decoration: none;
                color: var(--color-links);
            }

            a:hover {
                text-decoration: underline;
                color: var(--color-links-darker);
            }

        </style>
    </head>
    <body>
        <div>
            <h1>404 Not Found</h1>
            <p>Sorry, the page you're looking for doesn't exist.</p>
            <a href="https://loayidwan.com/">Go back to loayidwan.com homepage</a>
        </div>

</html>
