  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai"
    />

      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta
      name="bingbot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />

    <meta name="slurp" content="noindex, nofollow" />
    <meta name="GPTBot" content="noindex, nofollow, noai, noimageai" />
    <meta name="CCBot" content="noindex, nofollow, noai, noimageai" />
    <meta name="ChatGPT-User" content="noindex, nofollow, noai, noimageai" />
    <meta name="ClaudeBot" content="noindex, nofollow, noai, noimageai" />
    <meta name="PerplexityBot" content="noindex, nofollow, noai, noimageai" />
    <meta
      http-equiv="X-Robots-Tag"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    />
    <meta name="theme-color" content="#000000" />
    <style>
      :root {
        --bg: #000000;
        --panel: #0a0a0a;
        --border: #1f1f1f;
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --chip: #111111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
      }

      .card {
        width: min(620px, 100%);
        background: linear-gradient(160deg, #121212, #060606);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 2.8vw, 2.2rem);
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .contact-list {
        list-style: none;
        margin: 24px 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .contact-list li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
      }

      .label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .value,
      .value a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .value a:hover {
        text-decoration: underline;
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }

      .quick-links a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid #2a2a2a;
        background: #141414;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
      }

      .quick-links a:hover {
        transform: translateY(-1px);
        background: #1b1b1b;
        border-color: #3a3a3a;
      }

      @media (max-width: 560px) {
        .card {
          border-radius: 16px;
          padding: 20px;
        }

        .contact-list li {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .value,
        .value a {
          width: 100%;
          text-align: left;
        }

        .quick-links {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 360px) {
        .quick-links {
          grid-template-columns: 1fr;
        }
      }

      .note {
        margin-top: 16px;
        font-size: 0.8rem;
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Loay idwan</h1>
      <p class="subtitle">Digital Contact Card</p>

      <ul class="contact-list">
        <li>
          <span class="label">Phone</span>
          <span class="value"><a href="tel:0780055770">0780055770</a></span>
        </li>
        <li>
          <span class="label">Email</span>
          <span class="value"><a href="mailto:Loay@Lidwan.com">Loay@Lidwan.com</a></span>
        </li>
        <li>
          <span class="label">Instagram</span>
          <span class="value"><a href="https://instagram.com/Loayidwan">@Loayidwan</a></span>
        </li>
        <li>
          <span class="label">Portfolio</span>
          <span class="value"><a href="https://www.loayidwan.com">www.loayidwan.com</a></span>
        </li>
      </ul>

      <section class="quick-links" aria-label="Quick contact links">
        <a href="https://wa.me/0780055770">WhatsApp</a>
        <a href="https://www.loayidwan.com">Portfolio</a>
      </section>
    </main>
  </body>
</html>
