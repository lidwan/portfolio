<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loay Idwan | Contact Card</title>
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai"
    />
    <meta
      name="googlebot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta
      name="bingbot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta name="duckduckbot" content="noindex, nofollow" />
    <meta name="slurp" content="noindex, nofollow" />
    <meta name="GPTBot" content="noindex, nofollow, noai, noimageai" />
    <meta name="CCBot" content="noindex, nofollow, noai, noimageai" />
    <meta name="ChatGPT-User" content="noindex, nofollow, noai, noimageai" />
    <meta name="ClaudeBot" content="noindex, nofollow, noai, noimageai" />
    <meta name="PerplexityBot" content="noindex, nofollow, noai, noimageai" />
    <meta
      http-equiv="X-Robots-Tag"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    />
    <meta name="theme-color" content="#000000" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bg: #000000;
        --panel: #0a0a0a;
        --border: #1f1f1f;
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --chip: #111111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .page {
        min-height: calc(
          100vh - (max(16px, env(safe-area-inset-top)) + max(16px, env(safe-area-inset-bottom)))
        );
        display: flex;
        flex-direction: column;
      }

      nav {
        margin: 15px;
        font-size: 1.4rem;
      }

      nav ul {
        gap: 2.5vw;
      }

      nav a:hover {
        text-decoration: none;
      }

      #title {
        font-size: 1.5rem;
        font-weight: bold;
        color: #ffffff;
      }

      .card-wrap {
        flex: 1;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(620px, 100%);
        background: linear-gradient(160deg, #121212, #060606);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 2.8vw, 2.2rem);
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .contact-list {
        list-style: none;
        margin: 24px 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .contact-list li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
      }

      .label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .value,
      .value a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .value a:hover {
        text-decoration: underline;
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
      }

      .quick-links a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid #2a2a2a;
        background: #141414;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
      }

      .quick-links a:hover {
        transform: translateY(-1px);
        background: #1b1b1b;
        border-color: #3a3a3a;
      }

      .footer {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 16px;
        margin: 0;
      }

      @media screen and (max-width: 1200px) {
        .footer {
          padding: 3vw;
        }
      }

      @media (max-width: 560px) {
        nav {
          margin: 10px;
          font-size: 1.2rem;
        }

        .card {
          border-radius: 16px;
          padding: 20px;
        }

        .contact-list li {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .value,
        .value a {
          width: 100%;
          text-align: left;
        }

        .quick-links {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media screen and (max-width: 620px) {
        .footer {
          padding: 5vw;
        }
      }

      @media (max-width: 360px) {
        .quick-links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="navbar navbar-expand-lg bg-black navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand" id="title" href="https://loayidwan.com/">Loay Idwan</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="https://loayidwan.com/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="https://loayidwan.com/#about">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="https://blog.loayidwan.com/">Blog</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="https://loayidwan.com/#projects">Projects</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="https://loayidwan.com/#contact">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="card-wrap">
        <main class="card">
          <h1>Loay Idwan</h1>
          <p class="subtitle">Digital Contact Card</p>

          <ul class="contact-list">
            <li>
              <span class="label">Phone</span>
              <span class="value"><a href="tel:0780055770">0780055770</a></span>
            </li>
            <li>
              <span class="label">Email</span>
              <span class="value"><a href="mailto:Loay@Lidwan.com">Loay@Lidwan.com</a></span>
            </li>
            <li>
              <span class="label">Instagram</span>
              <span class="value"><a href="https://instagram.com/Loayidwan">@Loayidwan</a></span>
            </li>
            <li>
              <span class="label">Portfolio</span>
              <span class="value"><a href="https://www.loayidwan.com">www.loayidwan.com</a></span>
            </li>
          </ul>

          <section class="quick-links" aria-label="Quick contact links">
            <a href="tel:0780055770">Call</a>
            <a href="mailto:Loay@Lidwan.com">Email</a>
            <a href="https://wa.me/0780055770">WhatsApp</a>
            <a href="https://instagram.com/Loayidwan">Instagram</a>
            <a href="https://www.loayidwan.com">Portfolio</a>
          </section>
        </main>
      </div>

      <p class="footer">&copy; <span id="year"></span> Loay Idwan.</p>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
